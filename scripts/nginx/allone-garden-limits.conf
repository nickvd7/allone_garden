# AllOne Garden — rate/connection limits (included from http { } via conf.d)
# Overschrijfbaar via /etc/nginx/conf.d/allone-garden-limits.local.conf

limit_req_zone $binary_remote_addr zone=ag_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ag_auth:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=ag_general:10m rate=12r/s;
limit_conn_zone $binary_remote_addr zone=ag_perip:10m;
limit_conn_zone $server_name zone=ag_global:10m;
