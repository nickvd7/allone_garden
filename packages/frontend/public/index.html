<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4caf50" />
    <meta name="description" content="Open-source multiplayer gardening game — grow together, own your world." />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Garden" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- Splash screens for common iPhone sizes -->
    <link rel="apple-touch-startup-image" href="/icons/splash-1170x2532.png"
          media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-1125x2436.png"
          media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" />

    <!-- Android Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph (share previews) -->
    <meta property="og:title"       content="AllOne Garden" />
    <meta property="og:description" content="Grow together, own your world. Free multiplayer gardening game." />
    <meta property="og:type"        content="website" />
    <meta property="og:image"       content="/icons/icon-512.png" />

    <title>AllOne Garden</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
