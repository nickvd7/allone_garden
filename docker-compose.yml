version: '3.9'

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       allone_garden
      POSTGRES_USER:     garden
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U garden -d allone_garden']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (optional: rate-limit state / pub-sub) ────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Backend (Node.js / Express + Socket.IO) ────────────────────────────────
  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV:     production
      PORT:         5000
      DATABASE_URL: postgres://garden:${POSTGRES_PASSWORD:-changeme}@db:5432/allone_garden
      REDIS_URL:    redis://redis:6379
      JWT_SECRET:   ${JWT_SECRET:?JWT_SECRET must be set}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      P2P_ENABLED:  ${P2P_ENABLED:-false}
      ADMIN_USERS:  ${ADMIN_USERS:-}
      SERVER_NAME:  ${SERVER_NAME:-AllOne Garden}
    ports:
      - '5000:5000'
    volumes:
      - ./plugins:/app/plugins:ro   # community plugins (read-only in container)
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:5000/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend (React, built + served via nginx) ─────────────────────────────
  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL:    ${FRONTEND_API_URL:-http://localhost:5000}
        REACT_APP_SERVER_NAME: ${SERVER_NAME:-AllOne Garden}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '3000:80'

volumes:
  postgres_data:
  redis_data:
