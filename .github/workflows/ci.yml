name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend tests ────────────────────────────────────────────────────────────
  backend:
    name: Backend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: packages/backend
        run: npm ci

      - name: Run backend tests (in-memory mode)
        working-directory: packages/backend
        env:
          NODE_ENV: test
          DATABASE_URL: ''
          JWT_SECRET: test-secret-for-ci-only
        run: npm test

  # ── Frontend build ───────────────────────────────────────────────────────────
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: packages/frontend
        run: npm ci

      - name: Build
        working-directory: packages/frontend
        env:
          REACT_APP_API_URL: http://localhost:5000
          CI: false
        run: npm run build

  # ── Docker build check ───────────────────────────────────────────────────────
  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t allone-garden-backend ./packages/backend

      - name: Build frontend image
        run: docker build -t allone-garden-frontend ./packages/frontend
