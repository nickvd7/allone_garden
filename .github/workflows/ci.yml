# Main CI — lint, tests, build, e2e, Docker.
# Security scanning (audit, gitleaks, Trivy, actionlint) lives in security.yml.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Docker Compose (syntax / merge) ─────────────────────────────────────────
  compose:
    name: Docker Compose validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Validate docker-compose.yml
        env:
          JWT_SECRET: ci-validate-only-min-32-characters-long-for-compose-config
        run: docker compose config

  # ── Lint ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Node.js 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace (npm ci)
        run: npm ci

      - name: Lint backend
        working-directory: packages/backend
        env:
          ESLINT_USE_FLAT_CONFIG: 'false'
        run: npm run lint --if-present

      - name: Lint frontend
        working-directory: packages/frontend
        env:
          ESLINT_USE_FLAT_CONFIG: 'false'
        run: npm run lint --if-present

      - name: Regenerate Gradendex (bundle + entry overrides)
        working-directory: packages/frontend
        run: npm run gradendex:extra

      - name: Check Gradendex i18n in sync
        run: |
          git diff --exit-code -- packages/frontend/src/i18n/gradendex.*.json || (
            echo "::error::Gradendex JSONs out of sync. Run: cd packages/frontend && npm run gradendex:extra, then commit the changes."
            exit 1
          )

  # ── Backend tests ─────────────────────────────────────────────────────────────
  # Dependency audit, secret scan, Trivy, actionlint → see .github/workflows/security.yml
  backend:
    name: Backend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace (npm ci)
        run: npm ci

      - name: Run backend tests (in-memory mode)
        working-directory: packages/backend
        env:
          NODE_ENV: test
          DATABASE_URL: ''
          JWT_SECRET: test-secret-for-ci-only-at-least-32-chars
        run: npm test -- --coverage --coverageReporters=lcov

      - name: Upload coverage to Codecov
        if: matrix.node == 20
        uses: codecov/codecov-action@1e68e06f1dbfde0e4cefc87efeba9e4643565303  # v5.1.2
        with:
          files: packages/backend/coverage/lcov.info
          flags: backend
        continue-on-error: true   # don't fail the build if Codecov is down

  # ── Frontend build ────────────────────────────────────────────────────────────
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Node.js 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace (npm ci)
        run: npm ci

      - name: Regenerate Gradendex (bundle + entry overrides)
        working-directory: packages/frontend
        run: npm run gradendex:extra

      - name: Check Gradendex i18n in sync
        run: |
          git diff --exit-code -- packages/frontend/src/i18n/gradendex.*.json || (
            echo "::error::Gradendex JSONs out of sync. Run: cd packages/frontend && npm run gradendex:extra, then commit the changes."
            exit 1
          )

      - name: Build
        working-directory: packages/frontend
        env:
          REACT_APP_API_URL: http://localhost:5000
          CI: false
          GENERATE_SOURCEMAP: false
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

  # ── E2E tests ─────────────────────────────────────────────────────────────────
  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Node.js 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace (npm ci)
        run: npm ci

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Build frontend for e2e
        working-directory: packages/frontend
        env:
          REACT_APP_API_URL: http://127.0.0.1:5000
          CI: false
          GENERATE_SOURCEMAP: false
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Run e2e tests
        working-directory: e2e
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # ── Docker build + push to GHCR ───────────────────────────────────────────────
  docker:
    name: Docker build & push
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567  # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6.10.0
        with:
          context: ./packages/backend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/allone-garden-backend:latest
            ghcr.io/${{ github.repository_owner }}/allone-garden-backend:${{ github.sha }}

      - name: Build frontend image
        uses: docker/build-push-action@v6.10.0
        with:
          context: ./packages/frontend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/allone-garden-frontend:latest
            ghcr.io/${{ github.repository_owner }}/allone-garden-frontend:${{ github.sha }}
