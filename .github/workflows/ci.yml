# Main CI — lint, tests, build, e2e, Docker.
# Security scanning (audit, gitleaks, Trivy, actionlint) lives in security.yml.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Force JS-based actions onto Node 24 (GitHub deprecated the Node 20 action runtime).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Docker Compose (syntax / merge) ─────────────────────────────────────────
  compose:
    name: Docker Compose validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Validate docker-compose.yml
        env:
          JWT_SECRET: ci-validate-only-min-32-characters-long-for-compose-config
          POSTGRES_PASSWORD: ci-validate-only
        run: docker compose config

  # ── Lint ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Node.js 22
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace (npm ci)
        run: npm ci

      - name: Lint backend
        working-directory: packages/backend
        env:
          ESLINT_USE_FLAT_CONFIG: 'false'
        run: npm run lint --if-present

      - name: Lint frontend
        working-directory: packages/frontend
        env:
          ESLINT_USE_FLAT_CONFIG: 'false'
        run: npm run lint --if-present

      - name: Regenerate Gradendex (bundle + entry overrides)
        working-directory: packages/frontend
        run: npm run gradendex:extra

      - name: Check Gradendex i18n in sync
        run: |
          git diff --exit-code -- packages/frontend/src/i18n/gradendex.*.json || (
            echo "::error::Gradendex JSONs out of sync. Run: cd packages/frontend && npm run gradendex:extra, then commit the changes."
            exit 1
          )

  # ── Backend tests ─────────────────────────────────────────────────────────────
  # Dependency audit, secret scan, Trivy, actionlint → see .github/workflows/security.yml
  backend:
    name: Backend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace (npm ci)
        run: npm ci

      - name: Run backend tests (in-memory mode)
        working-directory: packages/backend
        env:
          NODE_ENV: test
          DATABASE_URL: ''
          JWT_SECRET: test-secret-for-ci-only-at-least-32-chars
        run: npm test -- --coverage --coverageReporters=lcov

      - name: Upload coverage to Codecov
        if: matrix.node == 22
        uses: codecov/codecov-action@1e68e06f1dbfde0e4cefc87efeba9e4643565303  # v5.1.2
        with:
          files: packages/backend/coverage/lcov.info
          flags: backend
        continue-on-error: true   # don't fail the build if Codecov is down

  # ── Frontend build ────────────────────────────────────────────────────────────
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Node.js 22
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace (npm ci)
        run: npm ci

      - name: Regenerate Gradendex (bundle + entry overrides)
        working-directory: packages/frontend
        run: npm run gradendex:extra

      - name: Check Gradendex i18n in sync
        run: |
          git diff --exit-code -- packages/frontend/src/i18n/gradendex.*.json || (
            echo "::error::Gradendex JSONs out of sync. Run: cd packages/frontend && npm run gradendex:extra, then commit the changes."
            exit 1
          )

      - name: Build
        working-directory: packages/frontend
        env:
          REACT_APP_API_URL: http://localhost:5000
          CI: false
          GENERATE_SOURCEMAP: false
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

  # ── E2E tests ─────────────────────────────────────────────────────────────────
  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Node.js 22
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace (npm ci)
        run: npm ci

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Build frontend for e2e
        working-directory: packages/frontend
        env:
          REACT_APP_API_URL: http://127.0.0.1:5000
          CI: false
          GENERATE_SOURCEMAP: false
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Run e2e tests
        working-directory: e2e
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # ── Docker build + push to GHCR ───────────────────────────────────────────────
  docker:
    name: Docker build & push
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ./packages/backend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/allone-garden-backend:latest
            ghcr.io/${{ github.repository_owner }}/allone-garden-backend:${{ github.sha }}

      - name: Build frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ./packages/frontend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/allone-garden-frontend:latest
            ghcr.io/${{ github.repository_owner }}/allone-garden-frontend:${{ github.sha }}
