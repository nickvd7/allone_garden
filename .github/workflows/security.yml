# Security — dependency audit, secret scan, SAST, workflow lint, deployment config sanity.
# Complements packages/backend/scripts/security-check.js (also run here in CI with fake prod env).

name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Nightly (~03:00 UTC) — snelle signalering van nieuwe advisories; kost weinig minuten op GH free.
    # Te druk? Zet terug naar wekelijks, bv. '0 7 * * 1'.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Validate workflow YAML (expressions, permissions, deprecated syntax) ─────
  actionlint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install and run actionlint
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION="1.7.7"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o actionlint.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  actionlint.tar.gz" | sha256sum -c
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color

  # ── Tracked files that must never contain live secrets or keys ──────────────
  repo-hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: No .env files tracked in git
        run: |
          set -euo pipefail
          if git ls-files | grep -E '^\.env$|/\.env$'; then
            echo "::error::A .env file is tracked — remove from git; use .env.example only"
            exit 1
          fi
          echo "OK — no tracked .env files"

      - name: No OpenSSH private keys in tracked sources
        run: |
          set -euo pipefail
          # Exclude .github/workflows: this file contains the marker inside the grep command itself.
          matches=$(git grep -l "BEGIN OPENSSH PRIVATE KEY" -- . ':(exclude).github/workflows' 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "::error::Possible OpenSSH private key in tracked files:"
            echo "$matches"
            exit 1
          fi
          echo "OK — no OPENSSH private key markers outside workflow definitions"

  # ── Secret scanning (gitleaks) ───────────────────────────────────────────────
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action queries the PR commits API on pull_request events; without
    # pull-requests:read it fails with "Resource not accessible by integration" (403).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── npm audit (critical) — same policy as former CI audit job ───────────────
  npm-audit:
    name: npm audit (critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace (npm ci)
        run: npm ci

      - name: Audit workspace (critical only)
        # Production deps only. High/moderate findings are tracked via overrides
        # in the root package.json; this job fails only on critical severity.
        run: npm audit --omit=dev --audit-level=critical

  # ── Filesystem SAST (Trivy) + SARIF upload ──────────────────────────────────
  trivy-fs:
    name: SAST (Trivy filesystem)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@03e4368ac7daa2bd82b3e85262f3bf87ee112f57  # v3.36.0
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  # ── Same script as server prestart; env simulates minimal production ────────
  deployment-config-check:
    name: security-check.js (prod rules, CI env)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace (npm ci)
        run: npm ci

      - name: Run security-check.js with synthetic production env
        working-directory: packages/backend
        env:
          NODE_ENV: production
          SECURITY_CHECK_CI: 'true'
          JWT_SECRET: ci-synthetic-jwt-token-not-for-production-min-32-chars-xx
          ADMIN_USERS: ci-admin
          FRONTEND_URL: https://ci.example.invalid
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379
          SMTP_HOST: smtp.ci.example.invalid
        run: node scripts/security-check.js
