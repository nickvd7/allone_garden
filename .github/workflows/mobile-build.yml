name: Mobile Build (Capacitor)

permissions:
  contents: read
  actions: write   # upload-artifact

# Use Node 24 for JavaScript-based actions (checkout, setup-node, …) per GitHub deprecation timeline.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Builds the React frontend, syncs it into Capacitor native projects,
# and produces a debug APK (Android) artifact.
#
# iOS builds require a macOS runner with Xcode and valid code-signing
# certificates. The `build-ios` job below auto-runs only when all required
# Apple secrets are configured.
#
# Required repository secrets for signed Android release build:
#   ANDROID_KEYSTORE_BASE64  — base64-encoded .jks / .keystore file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# Required for iOS:
#   APPLE_CERTIFICATE         — base64-encoded .p12 distribution certificate
#   APPLE_CERTIFICATE_PASSWORD
#   APPLE_PROVISION_PROFILE   — base64-encoded .mobileprovision
#   APPLE_TEAM_ID

on:
  push:
    branches: [main]
    tags:     ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Android ──────────────────────────────────────────────────────────────────
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: '20'
          cache: npm
          # Repo root lockfile (explicit path avoids cache key issues with job working-directory)
          cache-dependency-path: ${{ github.workspace }}/package-lock.json

      - name: Set up Java 17 (required by Gradle)
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Install from repo root (postinstall patches @capacitor/cli for tar@7 extract API).
      - name: Install workspace dependencies
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Build React app
        working-directory: packages/frontend
        run: npm run build
        env:
          CI: false                          # treat warnings as warnings, not errors
          REACT_APP_API_URL: ""              # relative URLs — backend is on the same host

      - name: Add Android platform (if not already present)
        working-directory: packages/frontend
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        working-directory: packages/frontend
        run: npx cap sync android

      - name: Ensure Gradle wrapper is executable
        working-directory: packages/frontend/android
        run: chmod +x gradlew || true

      - name: Build debug APK
        working-directory: packages/frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: allone-garden-debug-${{ github.sha }}
          path: packages/frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # ── iOS (auto-runs only when Apple signing secrets are present) ──────────────
  build-ios:
    name: iOS IPA
    runs-on: macos-14
    defaults:
      run:
        working-directory: packages/frontend

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Check required Apple secrets
        id: ios-secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_ISSUER_ID" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_PRIVATE_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Apple signing secrets ontbreken; iOS build wordt overgeslagen."
          fi
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        if: steps.ios-secrets.outputs.ready == 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ github.workspace }}/package-lock.json
      - name: Install workspace dependencies
        if: steps.ios-secrets.outputs.ready == 'true'
        working-directory: ${{ github.workspace }}
        run: npm ci
      - name: Build React app
        if: steps.ios-secrets.outputs.ready == 'true'
        working-directory: packages/frontend
        run: npm run build
        env:
          CI: false
      - name: Add iOS platform (if not already present)
        if: steps.ios-secrets.outputs.ready == 'true'
        working-directory: packages/frontend
        run: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi
      - name: Sync Capacitor (iOS)
        if: steps.ios-secrets.outputs.ready == 'true'
        working-directory: packages/frontend
        run: npx cap sync ios
      - name: Import signing certificate
        if: steps.ios-secrets.outputs.ready == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Install provisioning profile
        if: steps.ios-secrets.outputs.ready == 'true'
        uses: apple-actions/download-provisioning-profiles@v3
        with:
          bundle-id: com.allonegarden.app
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APPLE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      - name: Build IPA
        if: steps.ios-secrets.outputs.ready == 'true'
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App -configuration Release \
            -archivePath ios/App.xcarchive archive
          xcodebuild -exportArchive -archivePath ios/App.xcarchive \
            -exportPath ios/ipa -exportOptionsPlist ios/ExportOptions.plist
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        if: steps.ios-secrets.outputs.ready == 'true'
        with:
          name: allone-garden-ios-${{ github.sha }}
          path: packages/frontend/ios/ipa/*.ipa
          retention-days: 14
