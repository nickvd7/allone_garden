# Deploy production Raspberry Pi via self-hosted runner.
# Runner polls GitHub outbound — no inbound SSH / Cloudflare change required.
name: Deploy Pi

on:
  push:
    branches: [main]
  workflow_dispatch:

# Force JS-based actions onto Node 24 (same as ci.yml).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy-pi
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy with rollback
    # Register the Pi runner with this label (see INSTALL.md).
    runs-on: [self-hosted, linux, allone-pi]
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Deploy (pull + health-check + auto-rollback)
        # Working copy lives on the Pi next to production; do not use actions/checkout
        # as the deploy source — we update the local clone, then rsync to /opt.
        env:
          # Prefer Actions token so HTTPS clones work without interactive login
          # (SSH deploy key remains optional for manual git pull on the Pi).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SOURCE_DIR="${GARDEN_SOURCE_DIR:-$HOME/coding/allone_garden}"
          if [[ ! -f "${SOURCE_DIR}/scripts/deploy-with-rollback.sh" ]]; then
            echo "Clone niet gevonden op ${SOURCE_DIR}"
            echo "Zet GARDEN_SOURCE_DIR op de runner, of clone naar ~/coding/allone_garden"
            exit 1
          fi
          cd "$SOURCE_DIR"

          REPO_SLUG="${GITHUB_REPOSITORY:-nickvd7/allone_garden}"
          # Fetch without rewriting stored remotes (avoids leaving a token in .git/config).
          git fetch --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO_SLUG}.git" \
            "+refs/heads/main:refs/remotes/origin/main"
          git checkout -B main origin/main
          git reset --hard "${TARGET_SHA}"

          # deploy.sh would git-pull again; skip that — we already synced to TARGET_SHA.
          sudo --preserve-env=GARDEN_SOURCE_DIR,GARDEN_DEPLOY_DIR,GARDEN_HEALTH_URLS,GARDEN_LAST_GOOD_FILE,DEPLOY_GIT_PULL \
            DEPLOY_GIT_PULL=0 \
            bash scripts/deploy-with-rollback.sh
